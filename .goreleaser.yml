version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: ricardosalcedo
      name: homebrew-tap
    homepage: https://github.com/ricardosalcedo/awslens
    description: A modern TUI for AWS — see everything, navigate fast
    license: MIT
